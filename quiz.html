<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .question-group {
            margin-bottom: 25px;
        }

        .question-text {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background: #764ba2;
        }

        #result {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
            border: 2px solid #667eea;
        }

        #result h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 24px;
        }

        #score {
            font-size: 48px;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
        }

        #message {
            font-size: 18px;
            color: #333;
            margin-top: 15px;
        }

        .reset-btn {
            background: #764ba2;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz">
            <h1>Web Development Quiz</h1>

            <div class="question-group">
                <div class="question-text">1. What does HTML stand for?</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" name="q1" value="wrong1" id="q1a">
                        <label for="q1a">Hyper Text Markup Language</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q1" value="correct" id="q1b">
                        <label for="q1b">HyperText Markup Language</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q1" value="wrong2" id="q1c">
                        <label for="q1c">Home Tool Markup Language</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q1" value="wrong3" id="q1d">
                        <label for="q1d">Hyperlinks and Text Markup Language</label>
                    </div>
                </div>
            </div>

            <div class="question-group">
                <div class="question-text">2. Which property is used to change text color in CSS?</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" name="q2" value="wrong1" id="q2a">
                        <label for="q2a">text-color</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q2" value="correct" id="q2b">
                        <label for="q2b">color</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q2" value="wrong2" id="q2c">
                        <label for="q2c">font-color</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q2" value="wrong3" id="q2d">
                        <label for="q2d">text-style</label>
                    </div>
                </div>
            </div>

            <div class="question-group">
                <div class="question-text">3. What is the correct syntax for JavaScript comments?</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" name="q3" value="correct" id="q3a">
                        <label for="q3a">// This is a comment</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q3" value="wrong1" id="q3b">
                        <label for="q3b"># This is a comment</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q3" value="wrong2" id="q3c">
                        <label for="q3c">-- This is a comment</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q3" value="wrong3" id="q3d">
                        <label for="q3d">/* This is a comment */</label>
                    </div>
                </div>
            </div>

            <div class="question-group">
                <div class="question-text">4. What does CSS stand for?</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" name="q4" value="wrong1" id="q4a">
                        <label for="q4a">Computer Style Sheets</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q4" value="correct" id="q4b">
                        <label for="q4b">Cascading Style Sheets</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q4" value="wrong2" id="q4c">
                        <label for="q4c">Colorful Style Sheets</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q4" value="wrong3" id="q4d">
                        <label for="q4d">Creative Style Sheets</label>
                    </div>
                </div>
            </div>

            <div class="question-group">
                <div class="question-text">5. Which method is used to select an HTML element by ID in JavaScript?</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" name="q5" value="correct" id="q5a">
                        <label for="q5a">getElementById()</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q5" value="wrong1" id="q5b">
                        <label for="q5b">getElementByID()</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q5" value="wrong2" id="q5c">
                        <label for="q5c">selectById()</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="q5" value="wrong3" id="q5d">
                        <label for="q5d">queryElement()</label>
                    </div>
                </div>
            </div>

            <button onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <div id="result">
            <h2>Quiz Completed!</h2>
            <div id="score"></div>
            <div id="message"></div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        function submitQuiz() {
            const answers = {
                q1: document.querySelector('input[name="q1"]:checked')?.value,
                q2: document.querySelector('input[name="q2"]:checked')?.value,
                q3: document.querySelector('input[name="q3"]:checked')?.value,
                q4: document.querySelector('input[name="q4"]:checked')?.value,
                q5: document.querySelector('input[name="q5"]:checked')?.value
            };

            let score = 0;
            for (let key in answers) {
                if (answers[key] === 'correct') score++;
            }

            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('score').textContent = score + ' / 5';

            const messages = {
                5: 'Perfect! You are a web development expert!',
                4: 'Great job! You have solid web development knowledge.',
                3: 'Good effort! Keep learning and practicing.',
                2: 'You need to study more about web development.',
                1: 'Keep practicing! You will improve soon.',
                0: 'Try again and learn the basics first.'
            };

            document.getElementById('message').textContent = messages[score];
        }

        function resetQuiz() {
            document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
